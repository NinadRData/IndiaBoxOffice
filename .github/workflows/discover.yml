name: Discover new films

on:
  schedule:
    - cron: '50 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: film-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python discover.py
      - name: Collect historical reference totals
        run: python historical_totals.py
        continue-on-error: true

      - name: Collect verified historical daily data
        run: python historical_daily.py
        continue-on-error: true

      - name: Test historical forecast baseline
        run: python backtest_history.py
        continue-on-error: true
      - name: Collect worldwide daily totals
        run: python worldwide_sync.py
        continue-on-error: true

      - name: Save discovered films
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/discovered.json
          if [ -f data/historical_totals.json ]; then
            git add data/historical_totals.json
          fi
                    if [ -f data/historical.json ]; then
            git add data/historical.json
          fi
          if [ -f data/worldwide.json ]; then
          git add data/worldwide.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update discovered films'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
